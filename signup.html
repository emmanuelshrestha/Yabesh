<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="Sign up page for Yabesh Shrestha's personal website">
        <meta property="og:title" content="Sign Up - Yabesh Shrestha">
        <meta property="og:description" content="Sign up to stay updated with Yabesh Shrestha's latest projects and news">
        <link rel="icon" href="YS.png" type="image/png">
        <link rel="apple-touch-icon" href="YS.png">
        <meta property="og:image" content="YS.png">
        <title>Sign Up - Yabesh Shrestha</title> 
        
        <!-- =============================================
             FONT IMPORTS
             ============================================= -->
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Hanuman:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        
        <!-- =============================================
             CSS FILES
             ============================================= -->
        <link rel="stylesheet" href="sign-up.css" />
    </head>
    <body>
        <!-- =============================================
             STARFIELD BACKGROUND
             ============================================= -->
        <div class="star-field" id="starField"></div>

        <div class="signup-form-container">
            <h1>Sign Up for Updates</h1>
            <form name="signup-form" method="POST" class="signup-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit" class="signup-button">Sign Up</button>
            </form>
        <script src="script.js"></script>
    </body>
</html>
